# Generated by LabTestingInit, moved to Windows: Swappy compiles against the game's own
# mscorlib/netstandard/System, which fails on Linux runners (see LabTesting's Continuous-Integration
# wiki page). LabTesting's version lives only in the test project's PackageReference.
name: Plugin tests
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  integration:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      TEST_PROJECT: tests/Swappy.Tests/Swappy.Tests.csproj
      SL_REFERENCES: ${{ github.workspace }}/.server/SCPSL_Data/Managed
      # Restored packages land here, so the server install script below has a known path.
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore $env:TEST_PROJECT
      - name: Install dedicated server 996560
        run: |
          $script = Resolve-Path "$env:NUGET_PACKAGES/labtesting/*/tools/server/install-server.ps1" | Select-Object -First 1
          & $script -Server "$env:GITHUB_WORKSPACE/.server" -SteamCmd "$env:RUNNER_TEMP/steamcmd"
      - name: Build and test
        timeout-minutes: 12
        run: |
          dotnet build $env:TEST_PROJECT -c Release --no-restore -t:LabTesting `
            -p:LabTestingServer="$env:GITHUB_WORKSPACE/.server" `
            -p:LabTestingReports="$env:GITHUB_WORKSPACE/TestResults" `
            -p:LabTestingWork="$env:GITHUB_WORKSPACE/.labtest-work" `
            -p:LabTestingTimeout=600
          exit $LASTEXITCODE
      - name: Publish summary
        if: always()
        run: |
          if (Test-Path TestResults) {
            Get-ChildItem TestResults -Recurse -Filter summary.md | Get-Content | Add-Content $env:GITHUB_STEP_SUMMARY
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: labtesting-results
          path: TestResults/
          if-no-files-found: warn
      - name: Recover interrupted runs
        if: always()
        run: |
          if (Test-Path "$(Split-Path $env:TEST_PROJECT)/obj/project.assets.json") {
            dotnet msbuild $env:TEST_PROJECT -t:LabTestingCleanup -p:LabTestingWork="$env:GITHUB_WORKSPACE/.labtest-work"
          }
